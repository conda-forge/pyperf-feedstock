schema_version: 1

context:
  name: pyperf
  version: "2.11.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: e53813a2d97dc5a89760cf660dbd1b6a142558fcb6d32b3529c8a6b2d03dbdf8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - pyperf = pyperf.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}
    - psutil >=5.9.0

tests:
  - python:
      python_version:
        - '*'
        - ${{ python_min }}.*
      imports:
        - pyperf
  - script:
      - pyperf --help

about:
  license: MIT
  license_file: COPYING
  summary: Toolkit to run Python benchmarks
  homepage: http://github.com/psf/pyperf/
  repository: https://github.com/psf/pyperf/
  documentation: http://pyperf.readthedocs.io/

extra:
  recipe-maintainers:
    - langmm
    - xhochy
